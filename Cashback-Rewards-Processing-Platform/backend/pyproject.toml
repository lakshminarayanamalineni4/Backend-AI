[project]
name = "Cashback-Rewards-Processing-Platform"
version = "0.1.0"
description = "Cashback & Rewards Processing Platform 2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "pydantic-settings",
    "python-multipart",
    "sentence-transformers>=5.6.0",
    "faiss-cpu>=1.14.3",
    "numpy>=2.4.6",
    "google-generativeai>=0.8.6",
    "rank-bm25>=0.2.2",
    "pypdf>=6.14.2",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.1",
    "langgraph>=1.2.9",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
